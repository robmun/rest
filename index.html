<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>my fav rest's</title>
<meta name="description" content="Robert's restaurantlijst met kaart">
<meta name="theme-color" content="#F2F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="my fav rest's">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="title-row">
      <h1>Tafels</h1>
      <button class="sync" id="syncBtn" type="button" aria-label="Synchronisatie en instellingen">
        <span class="dot" id="syncDot"></span><span id="syncText">Laden…</span>
      </button>
    </div>
    <div class="seg" id="cities" role="group" aria-label="Lijst"></div>
    <div class="search-row">
      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Zoek op naam of notitie" autocomplete="off" aria-label="Zoeken">
      </label>
      <span class="count" id="count"></span>
    </div>
    <div class="chips" id="filters" role="group" aria-label="Filter op kenmerk"></div>
    <div class="geo-progress" id="geoProgress" hidden></div>
  </header>

  <main id="main">
    <section id="listView" class="view">
      <div class="notice" id="notice" hidden></div>
      <ul class="list" id="list"></ul>
      <div class="empty" id="empty" hidden></div>
      <div class="inspo" id="inspo" hidden></div>
    </section>
    <section id="mapView" class="view map-view" hidden>
      <div id="map" aria-label="Kaart met restaurants"></div>
      <button class="locate" id="locateBtn" type="button" aria-label="Toon mijn locatie">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
      </button>
      <div class="nopin" id="noPin" hidden></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="Weergave">
    <button type="button" class="tab" id="tabList" aria-pressed="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
      Lijst
    </button>
    <button type="button" class="add" id="addBtn" aria-label="Restaurant toevoegen">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button type="button" class="tab" id="tabMap" aria-pressed="false">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>
      Kaart
    </button>
  </nav>
</div>

<!-- Restaurant sheet -->
<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="grab"></div>
  <div class="sheet-head">
    <h2 id="sheetTitle">Restaurant toevoegen</h2>
    <button class="x" type="button" data-close aria-label="Sluiten">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <form id="form" novalidate>
    <label class="f">Naam<input id="fName" required autocomplete="off" placeholder="Bijv. Rakang"></label>
    <label class="f">Website<input id="fUrl" type="url" inputmode="url" autocomplete="off" placeholder="https://"></label>
    <label class="f">Lijst<select id="fCity"></select></label>
    <label class="f" id="newCityWrap" hidden>Naam nieuwe lijst<input id="fNewCity" autocomplete="off" placeholder="Bijv. Den Haag"></label>
    <label class="f">Notities<textarea id="fNotes" placeholder="Met wie, wat je at, tips…"></textarea></label>
    <div class="group">
      <span class="lbl">Kenmerken</span>
      <div class="tagpick" id="fTags"></div>
      <div class="inline">
        <input id="fNewTag" placeholder="Nieuw kenmerk" autocomplete="off" aria-label="Nieuw kenmerk">
        <button type="button" id="addTagBtn">Voeg toe</button>
      </div>
    </div>
    <label class="check"><input type="checkbox" id="fVisited"> Hier ben ik al geweest</label>
    <div class="group">
      <span class="lbl">Locatie op de kaart</span>
      <div class="inline">
        <input id="fAddress" placeholder="Adres (optioneel, bijv. Elandsgracht 29)" autocomplete="off" aria-label="Adres">
        <button type="button" id="findBtn">Zoek</button>
      </div>
      <div id="miniMap" class="mini-map"></div>
      <p class="hint" id="pinHint">Tik op de kaart om de pin te zetten of te verplaatsen.</p>
    </div>
    <p class="err" id="fErr" hidden></p>
    <div class="actions">
      <button type="button" class="del" id="delBtn" hidden>Verwijderen</button>
      <button type="submit" class="primary" id="saveBtn">Opslaan</button>
    </div>
  </form>
</div>

<!-- Settings sheet -->
<div class="sheet" id="settings" role="dialog" aria-modal="true" aria-labelledby="setTitle" hidden>
  <div class="grab"></div>
  <div class="sheet-head">
    <h2 id="setTitle">Synchronisatie</h2>
    <button class="x" type="button" data-close aria-label="Sluiten">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <form id="setForm" novalidate>
    <p class="hint">Je lijst wordt automatisch bewaard op GitHub en is hetzelfde op elk toestel waarop je de app gebruikt.</p>
    <p class="ok" id="sOk" hidden></p>
    <p class="err" id="sErr" hidden></p>
    <div class="actions">
      <button type="submit" class="primary" id="connectBtn">Nu synchroniseren</button>
    </div>
    <div class="group backup">
      <span class="lbl">Back-up</span>
      <div class="inline">
        <button type="button" id="exportBtn">Download back-up</button>
        <label class="filebtn">Zet back-up terug<input type="file" id="importFile" accept="application/json,.json" hidden></label>
      </div>
    </div>
  </form>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="app.js"></script>
</body>
</html>
